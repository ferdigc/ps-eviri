name: APK derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: tv/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: phone-apk
          path: phone/build/outputs/apk/debug/*.apk
          
